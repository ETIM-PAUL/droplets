name: Preview deploy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork PRs have no access to secrets, so they skip the deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @railkit/miniapp build
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/miniapp/dist --project-name=errand-miniapp --branch=pr-${{ github.event.number }}
      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: "Preview: ${{ steps.deploy.outputs.deployment-url }}"

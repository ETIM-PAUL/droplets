# GitBook site sync: one site, with one space whose pages are the `guide` folder (laid out by guide/SUMMARY.md).
# GitBook matches spaces by `key`, so don't change it. To rename the space change `title`; to change its URL change `path`.
$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Droplets
  structure:
    - type: space
      key: droplets-guide
      title: Droplets
      path: docs
      default: true
      content:
        directory: ./guide
        language: en

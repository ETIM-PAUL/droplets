# Render Blueprint for Droplets: the API, and the Mini App as a static site. Postgres is external (DATABASE_URL).
# In Render: New > Blueprint > pick this repo. Secrets (sync: false) are asked for once and never stored here.
services:
  - type: web
    name: droplets-api
    runtime: node
    # The free plan sleeps after about 15 minutes idle, so the first request then takes about a minute.
    # Choose a paid plan here to keep it awake.
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @railkit/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Who may call the API: the Mini App's address. Change it if Render gives the app a different one.
      - key: ALLOWED_ORIGINS
        value: https://droplets-app.onrender.com
      # Postgres, from Neon (or any Postgres). Use the direct connection string, not the pooled one: the API runs its
      # own table migrations at startup. Render's free tier allows one database per account, so it isn't used here.
      - key: DATABASE_URL
        sync: false
      # Bearer token for /v1/admin/: approving apps that sign up to save with Droplets, and paying draw prizes.
      # Render generates it: copy it from the service's Environment page.
      - key: ADMIN_TOKEN
        generateValue: true
      # Optional: a Slack or Discord webhook for feedback, new app sign-ups and each week's draw result. Leave empty to skip.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Optional: Ask Droplets uses a model only to read other languages and reword answers. Leave empty for rules only.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AGENT_MODEL_CALLS_PER_DAY
        value: "300"
      # Open to everyone. For an invite-only beta, set "true" and add BETA_INVITES and SESSION_SECRET.
      - key: BETA_REQUIRED
        value: "false"
      # Savings. SAVE_NETWORK must match the network Nimiq Pay runs on: testnet or mainnet.
      # The Nimiq node defaults to rpc.nimiqwatch.com (or its testnet twin); set NIMIQ_RPC_URL to use another.
      - key: SAVE_ENABLED
        value: "true"
      - key: SAVE_NETWORK
        value: mainnet
      # The weekly draw. PRIZE_ADDRESS is the prize wallet; its key stays with `pnpm pay-prizes`, never here.
      # PRIZE_ADDRESS is the mainnet prize wallet you fund: Render asks for it once. Until it's set the draw still runs,
      # but the API can't check that a prize was paid. Prize draws are regulated in many countries, so check
      # before paying real prizes; PRIZE_ENABLED "false" switches the draw off.
      # Sleeping on the free plan is fine: each draw is decided by a block, and kept days are read from the chain.
      - key: PRIZE_ENABLED
        value: "true"
      - key: PRIZE_NIM
        value: "1000"
      - key: PRIZE_MIN_NIM
        value: "1000"
      - key: PRIZE_DAYS
        value: "5"
      - key: PRIZE_UTC_OFFSET_MINUTES
        value: "60"
      - key: PRIZE_ADDRESS
        sync: false

  - type: web
    name: droplets-app
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @railkit/miniapp build
    staticPublishPath: apps/miniapp/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's address. Change it if Render gives the API a different one.
      - key: VITE_RAILKIT_API_URL
        value: https://droplets-api.onrender.com
    # /admin is its own page (admin.html), for the team: sign in with ADMIN_TOKEN.
    routes:
      - type: rewrite
        source: /admin
        destination: /admin.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
